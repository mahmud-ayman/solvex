workflows:
  ios-workflow:
    name: iOS IPA Build - Solvex
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      
      - name: Set App Display Name to Solvex
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Solvex" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName Solvex" ios/Runner/Info.plist
      
      - name: Install Pods
        script: |
          cd ios
          pod install --repo-update
      
      - name: Build Unsigned iOS IPA
        script: |
          set -e
          flutter build ios --release --no-codesign
          
          mkdir -p build/ios/ipa/Payload
          
          APP_PATH=$(find build -name "Runner.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          
          cp -R "$APP_PATH" build/ios/ipa/Payload/
          
          cd build/ios/ipa
          # استخدم ditto بدل zip عشان الـ IPA يبقى متوافق
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload Solvex_Unsigned.ipa
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log